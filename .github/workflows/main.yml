name: EdgeVoice Arm64 Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  benchmark:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show system information
        run: |
          echo "===== SYSTEM INFORMATION ====="
          uname -a
          echo "Architecture:"
          uname -m
          echo "Python:"
          python3 --version

      - name: Run EdgeVoice application
        run: |
          printf "What is AI?\nexit\n" | python3 app/app.py

      - name: Run EdgeVoice benchmark
        run: |
          python3 benchmark/benchmark.py
